# Render Blueprint for the thePottedLeaf API (server/).
# Render dashboard → New → Blueprint → pick this repo. Fill in the secret values when asked.
services:
  - type: web
    name: pottedleaf-api
    runtime: node
    plan: free      # change to "starter" ($7/mo) to keep the API always awake
    region: singapore  # closest Render region to India
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_URL
        sync: false   # e.g. https://pottedleaf.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
